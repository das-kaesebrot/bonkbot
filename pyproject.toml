[project]
name = "bonkbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "das-kaesebrot", email = "49565683+das-kaesebrot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "aiohttp>=3.14.4",
]

[project.scripts]
bonkbot = "bonkbot.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
